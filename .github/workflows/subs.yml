name: Update TG subs

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch subs count
        run: |
          COUNT=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/getChatMembersCount?chat_id=-1002679769175" | grep -o '"result":[0-9]*' | grep -o '[0-9]*')
          echo "{\"count\": ${COUNT:-0}, \"updated\": \"$(date -u +%FT%TZ)\"}" > subs.json
          cat subs.json

      - name: Commit subs.json
        run: |
          git config user.name "subs-bot"
          git config user.email "subs-bot@users.noreply.github.com"
          git add subs.json
          git diff --cached --quiet || (git commit -m "Update subs count" && git push)
