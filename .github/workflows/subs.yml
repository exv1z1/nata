name: Update TG subs

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch subs count
        run: |
          if [ -z "${{ secrets.TELEGRAM_TOKEN }}" ]; then
            echo "::error::Secret TELEGRAM_TOKEN не задан. Repo → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          RESP=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/getChatMembersCount?chat_id=-1002679769175")
          echo "$RESP"
          COUNT=$(echo "$RESP" | grep -o '"result":[0-9]*' | grep -o '[0-9]*' || true)
          if [ -z "$COUNT" ]; then
            echo "::error::Telegram не вернул count. Проверь: 1) токен верный и не отозван, 2) бот добавлен в АДМИНЫ канала."
            exit 1
          fi
          echo "{\"count\": $COUNT, \"updated\": \"$(date -u +%FT%TZ)\"}" > subs.json
          cat subs.json

      - name: Commit subs.json
        run: |
          git config user.name "subs-bot"
          git config user.email "subs-bot@users.noreply.github.com"
          git add subs.json
          git diff --cached --quiet || (git commit -m "Update subs count" && git push)
