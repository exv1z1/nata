<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Форум \ NATO BASE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glow" id="glow"></div>

  <nav class="topbar">
    <div class="topbar__inner">
      <div class="menu">
        <a href="index.html" class="menu__item">
          <span class="menu__label">Основное</span>
          <span class="menu__line"></span>
        </a>
        <a href="board.html?board=pozor" class="menu__item" id="menuPozor">
          <span class="menu__label">Доска Позора</span>
          <span class="menu__line"></span>
        </a>
        <a href="board.html?board=shitpost" class="menu__item" id="menuShit">
          <span class="menu__label">Shitpost</span>
          <span class="menu__line"></span>
        </a>
      </div>
      <div class="topbar__right">
      <a href="https://t.me/+eXzi61WUcNkzMTgy" target="_blank" rel="noopener" class="subs" title="Наш Telegram-чат">
        <span class="subs__dot"></span>
        <span class="subs__count" id="subsCount">432</span>
        <span class="subs__label">в TG</span>
      </a>
      <a href="auth.html" class="authbtn" id="menuAuth"><span class="menu__label">Войти</span></a>
      </div>
    </div>
  </nav>

  <main class="page page--wide">
    <h1 class="title" id="boardTitle">ФОРУМ</h1>
    <p class="muted" id="boardUser"></p>

    <form id="postForm" class="form hidden">
      <textarea id="postText" class="field" rows="3" maxlength="1000" placeholder="Текст поста (необязательно, если есть фото/видео)"></textarea>
      <input id="postFile" type="file" accept="image/*,video/*" class="file" />
      <button class="btn" type="submit" id="postBtn">Опубликовать</button>
    </form>

    <div id="posts" class="feed"></div>
  </main>

  <script src="script.js"></script>
  <script src="board.js"></script>
</body>
</html>
