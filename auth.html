<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <title>Вход \ NATO BASE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glow" id="glow"></div>

  <nav class="topbar">
    <div class="topbar__inner">
      <div class="menu">
        <a href="index.html" class="menu__item">
          <span class="menu__label">Основное</span>
          <span class="menu__line"></span>
        </a>
        <a href="board.html?board=pozor" class="menu__item">
          <span class="menu__label">Доска Позора</span>
          <span class="menu__line"></span>
        </a>
        <a href="board.html?board=shitpost" class="menu__item">
          <span class="menu__label">Shitpost</span>
          <span class="menu__line"></span>
        </a>
        <a href="secret.html" class="menu__item">
          <span class="menu__label">Секретный API</span>
          <span class="menu__line"></span>
        </a>
      </div>
      <div class="topbar__right">
      <a href="https://t.me/+eXzi61WUcNkzMTgy" target="_blank" rel="noopener" class="subs" title="Наш Telegram-чат">
        <span class="subs__dot"></span>
        <span class="subs__count" id="subsCount">432</span>
        <span class="subs__label">в TG</span>
      </a>
      </div>
    </div>
  </nav>

  <main class="page">
    <h1 class="title">ВХОД / РЕГИСТРАЦИЯ</h1>

    <div class="tabs">
      <button class="tab tab--active" id="tabLogin" type="button">Войти</button>
      <button class="tab" id="tabReg" type="button">Регистрация</button>
    </div>

    <form id="loginForm" class="form">
      <input id="loginLogin" class="field" type="text" placeholder="Логин" autocomplete="username" />
      <input id="loginPass" class="field" type="password" placeholder="Пароль" autocomplete="current-password" />
      <button class="btn" type="submit">Войти</button>
    </form>

    <form id="regForm" class="form hidden">
      <input id="regLogin" class="field" type="text" placeholder="Логин = твой ник (латиница, цифры, _)" maxlength="20" autocomplete="username" />
      <input id="regPass" class="field" type="password" placeholder="Пароль (мин. 8 символов)" autocomplete="new-password" />
      <input id="regInvite" class="field" type="text" placeholder="Инвайт-код" autocomplete="off" />
      <button class="btn" type="submit">Зарегистрироваться</button>
    </form>

    <p id="authMsg" class="muted"></p>
  </main>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
